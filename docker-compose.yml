version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unievent_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: unievent_flow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: unievent_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes

  # Máy chủ SMTP giả lập cho worker gửi email (FR-07, FR-16, FR-31, FR-35, FR-38).
  # Bắt mọi email thay vì gửi ra ngoài thật; xem hộp thư tại http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: unievent_mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP - khớp SMTP_PORT trong .env
      - "8025:8025" # Giao diện web xem email đã nhận
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpitdata:/data

volumes:
  pgdata:
  redisdata:
  mailpitdata: